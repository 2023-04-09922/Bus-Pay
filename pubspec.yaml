name: daladala

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  nfc_manager: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/daladala_logo.png
    - assets/icon/bus_pay_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/bus_pay_icon.png"
  min_sdk_android: 21